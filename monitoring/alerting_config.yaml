# Configurazione per il sistema di alerting.

# L'indirizzo email da cui verranno inviati gli alert.
sender_email: alert@example.com

# Lista degli indirizzi email che riceveranno le notifiche di allarme.
authorized_users:
  - admin@example.com

# Configurazione delle singole soglie di allarme.
alerts:
  # Allarme per l'utilizzo della CPU
  cpu_usage:
    # Soglia in percentuale.
    threshold: 85
    # Condizione: 'greater' (maggiore di) o 'less' (minore di).
    comparison: greater

  # Allarme per l'utilizzo della Memoria RAM
  memory_usage:
    threshold: 80
    comparison: greater

  # Allarme per lo spazio su disco UTILIZZATO.
  disk_space:
    threshold: 90
    comparison: greater
