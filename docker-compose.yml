services:
  mysql:
    image: mysql:8.0
    container_name: sql_playground_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sql_template # DB di default creato
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql # Volume per persistere i dati
      # Percorsi aggiornati per puntare dentro 'src'
      - ./backend/src/db/auth.sql:/docker-entrypoint-initdb.d/0-init-auth.sql
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/1-init-template.sql


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sql_playground_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data: